<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Testing Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f7fa;
            color: #333;
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .header h1 {
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1em;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: auto auto;
            gap: 30px;
            height: calc(100vh - 200px);
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border: 1px solid #e1e5e9;
        }

        .card h2 {
            margin-bottom: 20px;
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card h2::before {
            font-size: 1.2em;
        }

        .login-card h2::before { content: "🔐"; }
        .api-card h2::before { content: "🚀"; }
        .response-card h2::before { content: "📊"; }

        /* Login Component */
        .login-section {
            grid-column: 1;
            grid-row: 1;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group label {
            font-weight: 600;
            color: #555;
        }

        .form-group input, .form-group select {
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #3498db;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: #3498db;
            color: white;
        }

        .btn-primary:hover {
            background: #2980b9;
            transform: translateY(-1px);
        }

        .btn-danger {
            background: #e74c3c;
            color: white;
        }

        .btn-danger:hover {
            background: #c0392b;
            transform: translateY(-1px);
        }

        .btn-success {
            background: #27ae60;
            color: white;
        }

        .btn-success:hover {
            background: #229954;
            transform: translateY(-1px);
        }

        .status {
            padding: 10px;
            border-radius: 6px;
            margin-top: 15px;
            font-weight: 600;
        }

        .status.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .user-info {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 6px;
            margin-top: 15px;
        }

        .user-info h4 {
            margin-bottom: 10px;
            color: #2c3e50;
        }

        .user-info p {
            margin: 5px 0;
            font-size: 14px;
        }

        /* API Testing Component */
        .api-section {
            grid-column: 2;
            grid-row: 1;
        }

        .api-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .method-url-group {
            display: grid;
            grid-template-columns: 120px 1fr;
            gap: 10px;
        }

        .request-body {
            min-height: 150px;
            resize: vertical;
            font-family: 'Courier New', monospace;
            font-size: 13px;
        }

        .endpoint-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-bottom: 15px;
        }

        .endpoint-btn {
            padding: 8px 12px;
            border: 2px solid #3498db;
            background: white;
            color: #3498db;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
            text-align: center;
        }

        .endpoint-btn:hover {
            background: #3498db;
            color: white;
        }

        .endpoint-btn.selected {
            background: #3498db;
            color: white;
        }

        /* Response Component */
        .response-section {
            grid-column: 1 / 3;
            grid-row: 2;
        }

        .response-display {
            background: #2c3e50;
            color: #ecf0f1;
            padding: 20px;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.5;
            min-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .response-display.empty {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #95a5a6;
            font-style: italic;
        }

        .response-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .response-meta {
            display: flex;
            gap: 20px;
            font-size: 14px;
            color: #666;
        }

        .copy-btn {
            padding: 6px 12px;
            background: #34495e;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .copy-btn:hover {
            background: #2c3e50;
        }

        /* Disabled state */
        .disabled {
            opacity: 0.6;
            pointer-events: none;
        }

        /* Responsive Design */
        @media (max-width: 1024px) {
            .main-grid {
                grid-template-columns: 1fr;
                grid-template-rows: auto auto auto;
            }
            
            .response-section {
                grid-column: 1;
                grid-row: 3;
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }
            
            .method-url-group {
                grid-template-columns: 1fr;
            }
            
            .endpoint-buttons {
                grid-template-columns: 1fr;
            }
        }

        /* Animation for status messages */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .status {
            animation: fadeIn 0.3s ease-out;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧪 API Testing Dashboard</h1>
            <p>Test the Two-Tier User Permission System</p>
        </div>

        <div class="main-grid">
            <!-- Login Component -->
            <div class="card login-section">
                <h2>Authentication</h2>
                
                <div id="loginForm" class="login-form">
                    <div class="form-group">
                        <label for="username">Username:</label>
                        <select id="username" onchange="updatePassword()">
                            <option value="">Select a user...</option>
                            <option value="acmeadmin">acmeadmin (Admin)</option>
                            <option value="test">test (Regular User)</option>
                            <option value="globexmgr">globexmgr (Regular User)</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Password:</label>
                        <input type="password" id="password" placeholder="Password will auto-fill">
                    </div>
                    
                    <button class="btn btn-primary" onclick="login()">🔑 Login</button>
                    
                    <div id="loginStatus"></div>
                </div>

                <div id="userInfo" class="user-info" style="display: none;">
                    <h4>👤 Logged in as:</h4>
                    <p><strong>Username:</strong> <span id="currentUser"></span></p>
                    <p><strong>Role:</strong> <span id="currentRole"></span></p>
                    <p><strong>User Type ID:</strong> <span id="currentUserType"></span></p>
                    <p><strong>Permissions:</strong></p>
                    <ul id="currentPermissions" style="margin-left: 20px; margin-top: 5px;"></ul>
                    
                    <button class="btn btn-danger" onclick="logout()" style="margin-top: 15px;">🚪 Logout</button>
                </div>
            </div>

            <!-- API Testing Component -->
            <div class="card api-section">
                <h2>API Testing</h2>
                
                <div class="endpoint-buttons">
                    <button class="endpoint-btn" onclick="selectEndpoint('GET', '/db/v1/api/user/list', null)">📋 List Users</button>
                    <button class="endpoint-btn" onclick="selectEndpoint('GET', '/db/v1/api/user/search?q=test', null)">🔍 Search Users</button>
                    <button class="endpoint-btn" onclick="selectEndpoint('POST', '/db/v1/api/user/create', JSON.stringify({username: 'newuser', password: 'pass123', user_type_id: 2}, null, 2))">➕ Create User</button>
                    <button class="endpoint-btn" onclick="selectEndpoint('PUT', '/db/v1/api/user/update', JSON.stringify({username: 'updated_name'}, null, 2))">✏️ Update User</button>
                    <button class="endpoint-btn" onclick="selectEndpoint('DELETE', '/db/v1/api/user/delete', null)">🗑️ Delete User</button>
                    <button class="endpoint-btn" onclick="selectEndpoint('POST', '/db/v1/api/auth/validate', null)">✅ Validate Token</button>
                </div>

                <div class="api-form">
                    <div class="method-url-group">
                        <div class="form-group">
                            <label for="method">Method:</label>
                            <select id="method">
                                <option value="GET">GET</option>
                                <option value="POST">POST</option>
                                <option value="PUT">PUT</option>
                                <option value="DELETE">DELETE</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label for="endpoint">Endpoint:</label>
                            <input type="text" id="endpoint" placeholder="/db/v1/api/user/list">
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="requestBody">Request Body (JSON):</label>
                        <textarea id="requestBody" class="request-body" placeholder='{"key": "value"}'></textarea>
                    </div>
                    
                    <button class="btn btn-success disabled" id="sendRequestBtn" onclick="sendRequest()">🚀 Send Request</button>
                </div>
            </div>

            <!-- Response Component -->
            <div class="card response-section">
                <div class="response-header">
                    <h2>API Response</h2>
                    <div class="response-meta">
                        <span id="responseStatus"></span>
                        <span id="responseTime"></span>
                        <button class="copy-btn" onclick="copyResponse()" id="copyBtn" style="display: none;">📋 Copy</button>
                    </div>
                </div>
                
                <div id="responseDisplay" class="response-display empty">
                    No requests sent yet. Login and select an endpoint to test the API.
                </div>
            </div>
        </div>
    </div>

    <script>
        let authToken = null;
        let currentUserData = null;
        const baseUrl = window.location.origin;

        // Auto-fill password based on username selection
        function updatePassword() {
            const username = document.getElementById('username').value;
            const passwordField = document.getElementById('password');
            
            const passwords = {
                'acmeadmin': 'password123',
                'test': 'test123',
                'globexmgr': 'password123'
            };
            
            passwordField.value = passwords[username] || '';
        }

        // Login function
        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            if (!username || !password) {
                showLoginStatus('Please select a username and password', 'error');
                return;
            }
            
            const loginData = { username, password };
            
            try {
                const startTime = Date.now();
                const response = await fetch(`${baseUrl}/db/v1/api/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(loginData)
                });
                
                const endTime = Date.now();
                const data = await response.json();
                
                if (response.ok && data.status === 'success') {
                    authToken = data.data.token;
                    currentUserData = data.data.user;
                    
                    showLoginStatus('Login successful!', 'success');
                    showUserInfo();
                    enableApiTesting();
                    
                    // Show login response
                    displayResponse(data, response.status, endTime - startTime);
                } else {
                    showLoginStatus(data.message || 'Login failed', 'error');
                    displayResponse(data, response.status, endTime - startTime);
                }
            } catch (error) {
                showLoginStatus('Network error: ' + error.message, 'error');
                console.error('Login error:', error);
            }
        }

        // Logout function
        async function logout() {
            try {
                if (authToken) {
                    const startTime = Date.now();
                    const response = await fetch(`${baseUrl}/db/v1/api/auth/logout`, {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${authToken}`
                        }
                    });
                    const endTime = Date.now();
                    const data = await response.json();
                    displayResponse(data, response.status, endTime - startTime);
                }
            } catch (error) {
                console.error('Logout error:', error);
            }
            
            // Clear local state
            authToken = null;
            currentUserData = null;
            hideUserInfo();
            disableApiTesting();
            showLoginStatus('Logged out successfully', 'success');
            
            // Reset form
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        }

        // Show login status
        function showLoginStatus(message, type) {
            const statusDiv = document.getElementById('loginStatus');
            statusDiv.innerHTML = `<div class="status ${type}">${message}</div>`;
        }

        // Show user info
        function showUserInfo() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('userInfo').style.display = 'block';
            
            document.getElementById('currentUser').textContent = currentUserData.username;
            document.getElementById('currentRole').textContent = currentUserData.role;
            document.getElementById('currentUserType').textContent = currentUserData.user_type_id;
            
            const permissionsList = document.getElementById('currentPermissions');
            permissionsList.innerHTML = '';
            currentUserData.permissions.allowed_operations.forEach(perm => {
                const li = document.createElement('li');
                li.textContent = perm;
                permissionsList.appendChild(li);
            });
        }

        // Hide user info
        function hideUserInfo() {
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('userInfo').style.display = 'none';
        }

        // Enable API testing
        function enableApiTesting() {
            document.getElementById('sendRequestBtn').classList.remove('disabled');
        }

        // Disable API testing
        function disableApiTesting() {
            document.getElementById('sendRequestBtn').classList.add('disabled');
        }

        // Select endpoint
        function selectEndpoint(method, endpoint, body) {
            // Clear previous selection
            document.querySelectorAll('.endpoint-btn').forEach(btn => {
                btn.classList.remove('selected');
            });
            
            // Mark current selection
            event.target.classList.add('selected');
            
            document.getElementById('method').value = method;
            document.getElementById('endpoint').value = endpoint;
            document.getElementById('requestBody').value = body || '';
        }

        // Send API request
        async function sendRequest() {
            if (!authToken) {
                alert('Please login first');
                return;
            }
            
            const method = document.getElementById('method').value;
            const endpoint = document.getElementById('endpoint').value;
            const requestBody = document.getElementById('requestBody').value.trim();
            
            if (!endpoint) {
                alert('Please enter an endpoint');
                return;
            }
            
            const headers = {
                'Authorization': `Bearer ${authToken}`
            };
            
            const requestOptions = {
                method: method,
                headers: headers
            };
            
            // Add request body for POST/PUT requests
            if ((method === 'POST' || method === 'PUT') && requestBody) {
                try {
                    JSON.parse(requestBody); // Validate JSON
                    headers['Content-Type'] = 'application/json';
                    requestOptions.body = requestBody;
                } catch (error) {
                    alert('Invalid JSON in request body');
                    return;
                }
            }
            
            try {
                const startTime = Date.now();
                const response = await fetch(`${baseUrl}${endpoint}`, requestOptions);
                const endTime = Date.now();
                const data = await response.json();
                
                displayResponse(data, response.status, endTime - startTime);
            } catch (error) {
                displayResponse({ error: error.message }, 'Error', 0);
            }
        }

        // Display response
        function displayResponse(data, status, time) {
            const responseDisplay = document.getElementById('responseDisplay');
            const responseStatus = document.getElementById('responseStatus');
            const responseTime = document.getElementById('responseTime');
            const copyBtn = document.getElementById('copyBtn');
            
            // Format the response
            const formattedResponse = JSON.stringify(data, null, 2);
            
            responseDisplay.textContent = formattedResponse;
            responseDisplay.classList.remove('empty');
            
            // Update meta info
            responseStatus.textContent = `Status: ${status}`;
            responseTime.textContent = `Time: ${time}ms`;
            copyBtn.style.display = 'block';
            
            // Store response for copying
            responseDisplay.dataset.response = formattedResponse;
        }

        // Copy response to clipboard
        function copyResponse() {
            const responseText = document.getElementById('responseDisplay').dataset.response;
            navigator.clipboard.writeText(responseText).then(() => {
                const copyBtn = document.getElementById('copyBtn');
                const originalText = copyBtn.textContent;
                copyBtn.textContent = '✅ Copied!';
                setTimeout(() => {
                    copyBtn.textContent = originalText;
                }, 2000);
            });
        }

        // Initialize the page
        document.addEventListener('DOMContentLoaded', function() {
            // Check if already logged in (for page refresh)
            const savedToken = sessionStorage.getItem('authToken');
            const savedUser = sessionStorage.getItem('currentUser');
            
            if (savedToken && savedUser) {
                authToken = savedToken;
                currentUserData = JSON.parse(savedUser);
                showUserInfo();
                enableApiTesting();
            }
        });

        // Save state on login
        function saveState() {
            if (authToken && currentUserData) {
                sessionStorage.setItem('authToken', authToken);
                sessionStorage.setItem('currentUser', JSON.stringify(currentUserData));
            }
        }

        // Clear state on logout
        function clearState() {
            sessionStorage.removeItem('authToken');
            sessionStorage.removeItem('currentUser');
        }

        // Update the login function to save state
        const originalLogin = login;
        login = async function() {
            await originalLogin();
            if (authToken) saveState();
        };

        // Update the logout function to clear state
        const originalLogout = logout;
        logout = async function() {
            await originalLogout();
            clearState();
        };
    </script>
</body>
</html>
